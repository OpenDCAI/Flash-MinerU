[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-mineru"
description = "Fast Inference Architecture for MinerU"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11, <4"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = [
    "AI",
    "artificial intelligence",
]
dynamic = ["version", "dependencies"]

[project.urls]
Github = "https://github.com/OpenDCAI/Flash-MinerU"
"Bug Reports" = "https://github.com/OpenDCAI/Flash-MinerU/issues"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flash_mineru*"]

[tool.setuptools.dynamic]
version = {attr = "flash_mineru.version.__version__"}
dependencies = {file = "requirements.txt"}


[project.optional-dependencies]
vllm = ["vllm"]
